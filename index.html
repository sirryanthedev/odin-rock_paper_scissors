<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <script src="index.js"></script>

  <!-- orbitron font -->
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Press+Start+2P&display=swap" rel="stylesheet">


  <!-- Press Start 2P font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <h1>Rock Paper Scissors</h>
  </div>
  <div class="score-container">
    <div class="your-score-container">
      <div class="your-score">
            Your Score:
      </div>
      <div class="your-score-counter">
        0
      </div>
    </div>
    
    <div class="computer-score-container">
      <div class="computer-score">
            Computer's Score:
      </div>
      <div class="computer-score-counter">
        0
      </div>
    </div>
  </div>

  <div class="player-all-container">
    <div class="player-you-container">
      <div class="player-you">
        You
      </div>
      <div class="player-you-img-container">
        <img class="player-you-img">
      </div>
    </div>
    <div class="game-vs-text-container">
      <div class="vs-container">
        <p class="vs-text">VS</p>
      </div>
      <div class="game-text-container">
        <p class="game-text">game-text</p>
      </div>
    </div>
    <div class="player-computer-container">
      <div class="player-computer">
        Computer
      </div>
      <div class="player-computer-img-container">
        <img class="player-computer-img">
      </div>
    </div>
  </div>
  
  <div user-input-container>
    <div class="button-container">
      <button class="rock-button">
        Rock
      </button>
      <button class="paper-button">
        Paper
      </button>
      <button class="scissors-button">
        Scissors
      </button>
    </div>
    <div class="restart-img-container">
      <img src="images/power-restart-icon-3.png" class="restart-img">
    </div>
  </div>
 

  

  <div class="footer">
    <div class="footer-text">
      Copyright © 2026 sirryanthedev. All rights reserved.
    </div>
    <div>
      <a href="https://github.com/sirryanthedev">
        <img src="images/github-logo.png" alt="github page" class="footer-img">
      </a>
    </div>
  </div>
</body>
</html>
